# Cacao BTCPay stack for an Oracle Cloud VM (Ampere ARM, Ubuntu 24.04).
# Same services as infra/btcpay/docker-compose.yml, with these changes:
#  - Only caddy publishes ports (80 and 443). Everything else lives on the Docker network.
#  - caddy serves HTTPS for DOMINIO (Let's Encrypt, automatic) and passes every request to puerta.
#  - No cloudflared and no antivirus CA override.
#  - RED (regtest or mainnet) switches the network. instalar.sh writes /opt/cacao-btcpay/.env with the values
#    that depend on it: RED, DOMINIO, RPC_PASS, CHEATMODE, NODO_ESPECIFICO, NODO_TARIFA, LND_SEMILLA, COMPOSE_PROFILES.
#    Do not edit this file per network.
# Start: sudo systemctl start cacao-btcpay   (or, inside /opt/cacao-btcpay: docker compose up -d)

name: cacao-btcpay

services:
  bitcoind:
    image: btcpayserver/bitcoin:31.1
    restart: unless-stopped
    environment:
      BITCOIN_NETWORK: ${RED}
      BITCOIN_WALLETDIR: /walletdata
      BITCOIN_EXTRA_ARGS: |
        rpcuser=cacao
        rpcpassword=${RPC_PASS}
        rpcport=43782
        rpcbind=0.0.0.0:43782
        rpcallowip=0.0.0.0/0
        port=39388
        whitelist=0.0.0.0/0
        ${NODO_ESPECIFICO:-}
        ${NODO_TARIFA:-}
        zmqpubrawblock=tcp://0.0.0.0:28332
        zmqpubrawtx=tcp://0.0.0.0:28333
    volumes:
      - bitcoin_datadir:/data
      - bitcoin_wallet_datadir:/walletdata

  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      # Only reachable from the Docker network (no ports published), like the demo.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_datadir:/var/lib/postgresql/data

  nbxplorer:
    image: nicolasdorier/nbxplorer:2.6.19
    restart: unless-stopped
    depends_on: [bitcoind, postgres]
    environment:
      NBXPLORER_NETWORK: ${RED}
      NBXPLORER_CHAINS: btc
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_BTCRPCURL: http://bitcoind:43782/
      NBXPLORER_BTCRPCUSER: cacao
      NBXPLORER_BTCRPCPASSWORD: ${RPC_PASS}
      NBXPLORER_BTCNODEENDPOINT: bitcoind:39388
      NBXPLORER_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=nbxplorer
      NBXPLORER_NOAUTH: 1
      NBXPLORER_EXPOSERPC: 1
    volumes:
      - nbxplorer_datadir:/datadir

  btcpayserver:
    image: btcpayserver/btcpayserver:2.4.5
    restart: unless-stopped
    depends_on: [nbxplorer, postgres]
    # No published ports: caddy -> puerta -> btcpayserver, all on the Docker network.
    environment:
      BTCPAY_NETWORK: ${RED}
      BTCPAY_CHAINS: btc
      BTCPAY_BIND: 0.0.0.0:49392
      BTCPAY_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=btcpayserver
      BTCPAY_EXPLORERPOSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=nbxplorer
      BTCPAY_BTCEXPLORERURL: http://nbxplorer:32838/
      BTCPAY_DOCKERDEPLOYMENT: "true"
      # Test buttons on the checkout (pay, mine a block). Regtest only: instalar.sh sets CHEATMODE=false on mainnet.
      BTCPAY_CHEATMODE: ${CHEATMODE:-false}
      # The server's own Lightning node. Small amounts are dust on-chain, so they are paid by Lightning.
      BTCPAY_BTCLIGHTNING: type=lnd-rest;server=https://lnd_cacao:8080/;macaroonfilepath=/etc/lnd_cacao/data/chain/bitcoin/${RED}/admin.macaroon;allowinsecure=true
    volumes:
      - btcpay_datadir:/datadir
      - nbxplorer_datadir:/root/.nbxplorer
      - lnd_cacao_datadir:/etc/lnd_cacao:ro

  # Front door: the test wallet at /billetera (regtest only), and BTCPay for everything else.
  puerta:
    image: node:22-alpine
    restart: unless-stopped
    depends_on: [btcpayserver]
    command: ["node", "/app/servidor.mjs"]
    environment:
      RED: ${RED}
    volumes:
      - ./billetera:/app:ro
      - lnd_comprador_datadir:/lnd:ro

  # HTTPS for DOMINIO, then the front door. The only service with published ports.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [puerta]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datadir:/data
      - caddy_configdir:/config

  # Lightning node of Cacao. The stores receive here.
  lnd_cacao:
    image: btcpayserver/lnd:v0.21.3-beta-2
    restart: unless-stopped
    depends_on: [bitcoind]
    environment: &lnd
      LND_CHAIN: btc
      LND_ENVIRONMENT: ${RED}
      LND_ALIAS: cacao
      LND_PORT: 9735
      LND_REST_LISTEN_HOST: https://lnd_cacao:8080
      LND_EXTRA_ARGS: |
        restlisten=0.0.0.0:8080
        rpclisten=0.0.0.0:10009
        bitcoin.node=bitcoind
        bitcoind.rpchost=bitcoind:43782
        bitcoind.rpcuser=cacao
        bitcoind.rpcpass=${RPC_PASS}
        bitcoind.zmqpubrawblock=tcp://bitcoind:28332
        bitcoind.zmqpubrawtx=tcp://bitcoind:28333
        ${LND_SEMILLA:-}
        tlsextradomain=lnd_cacao
        tlsextradomain=lnd_comprador
        accept-keysend=1
    volumes:
      - lnd_cacao_datadir:/data

  # Lightning node of the test buyer. Demo only: it pays the test wallet's invoices through its channel to lnd_cacao.
  lnd_comprador:
    image: btcpayserver/lnd:v0.21.3-beta-2
    restart: unless-stopped
    profiles: [regtest]
    depends_on: [bitcoind]
    environment:
      <<: *lnd
      LND_ALIAS: comprador
      LND_REST_LISTEN_HOST: https://lnd_comprador:8080
    volumes:
      - lnd_comprador_datadir:/data

volumes:
  bitcoin_datadir:
  bitcoin_wallet_datadir:
  postgres_datadir:
  nbxplorer_datadir:
  btcpay_datadir:
  lnd_cacao_datadir:
  lnd_comprador_datadir:
  caddy_datadir:
  caddy_configdir:
